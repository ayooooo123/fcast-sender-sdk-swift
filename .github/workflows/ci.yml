name: FCast iOS Distribution CI

on:
  pull_request:
  push:
    branches: [main, "mediastorm/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  validate:
    runs-on: macos-26
    steps:
      - name: Check out event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate locked build environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "schemaVersion": 1,
              "runner": "macos-26",
              "xcodeVersion": "26.6",
              "xcodeBuildVersion": "17F113",
              "swiftVersion": "6.3.3",
              "swiftLanguageRevision": "swiftlang-6.3.3.1.3",
              "rustVersion": "1.96.1",
              "zipVersion": "3.0",
          }
          actual = json.loads(
              Path("build-environment.lock.json").read_text(encoding="utf-8")
          )
          if actual != expected:
              raise SystemExit("build environment lock does not match CI policy")
          PY

          LOCKED_XCODE="/Applications/Xcode_26.6.app"
          if [[ -d "$LOCKED_XCODE" ]]; then
            sudo xcode-select --switch "$LOCKED_XCODE/Contents/Developer"
          fi

          XCODE_OUTPUT="$(xcodebuild -version)"
          [[ "$XCODE_OUTPUT" == $'Xcode 26.6\nBuild version 17F113' ]]

          SWIFT_OUTPUT="$(swift --version)"
          [[ "$SWIFT_OUTPUT" == *"Apple Swift version 6.3.3 (swiftlang-6.3.3.1.3 "* ]]

          ACTUAL_MACOS_VERSION="$(sw_vers -productVersion)"
          ACTUAL_RUNNER="macos-${ACTUAL_MACOS_VERSION%%.*}"
          [[ "$ACTUAL_RUNNER" == "macos-26" ]]

          ZIP_OUTPUT="$(/usr/bin/zip -v)"
          [[ "$ZIP_OUTPUT" == *"This is Zip 3.0 "* ]]

      - name: Install locked Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 \
            aarch64-apple-ios \
            aarch64-apple-ios-sim
          RUST_OUTPUT="$(rustup run 1.96.1 rustc --version)"
          [[ "$RUST_OUTPUT" == "rustc 1.96.1 ("* ]]

      - name: Reject mutable package references
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '(gitlab\.futo\.org/.*/jobs/.*/artifacts|/latest/|releases/latest|branch[[:space:]]*:|from[[:space:]]*:|\.package\([^)]*from[[:space:]]*:|/(main|master|branches|raw)/)' Package.swift; then
            echo "Package.swift contains a mutable package reference" >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          def strip_comments(source):
              output = []
              index = 0
              state = "code"
              block_depth = 0
              while index < len(source):
                  pair = source[index:index + 2]
                  character = source[index]
                  if state == "code":
                      if pair == "//":
                          output.extend((" ", " "))
                          index += 2
                          state = "line-comment"
                      elif pair == "/*":
                          output.extend((" ", " "))
                          index += 2
                          state = "block-comment"
                          block_depth = 1
                      else:
                          output.append(character)
                          index += 1
                          if character == '"':
                              state = "string"
                  elif state == "string":
                      output.append(character)
                      index += 1
                      if character == "\\" and index < len(source):
                          output.append(source[index])
                          index += 1
                      elif character == '"':
                          state = "code"
                  elif state == "line-comment":
                      output.append("\n" if character == "\n" else " ")
                      index += 1
                      if character == "\n":
                          state = "code"
                  else:
                      if pair == "/*":
                          output.extend((" ", " "))
                          index += 2
                          block_depth += 1
                      elif pair == "*/":
                          output.extend((" ", " "))
                          index += 2
                          block_depth -= 1
                          if block_depth == 0:
                              state = "code"
                      else:
                          output.append("\n" if character == "\n" else " ")
                          index += 1
              if state in ("string", "block-comment"):
                  raise SystemExit("Package.swift contains an unterminated token")
              return "".join(output)

          manifest = Path("Package.swift").read_text(encoding="utf-8")
          code = strip_comments(manifest)
          url_token = re.compile(r"""https?://[^\s"'<>]+""")
          allowed_url = re.compile(
              r"https://github\.com/ayooooo123/fcast-sender-sdk-swift/"
              r"releases/download/"
              r"[0-9]+\.[0-9]+\.[0-9]+"
              r"(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?/"
              r"fcast_sender_sdk\.xcframework\.zip"
          )
          declaration = re.compile(
              r'(?m)^[ \t]*let[ \t]+url[ \t]*=[ \t]*'
              r'"([^"\\\r\n]+)"[ \t]*$'
          )
          binary_binding = re.compile(
              r'(?m)^[ \t]*\.binaryTarget\([ \t]*'
              r'name:[ \t]*"fcast_sender_sdkFFI",[ \t]*'
              r'url:[ \t]*url,[ \t]*'
              r'checksum:[ \t]*checksum[ \t]*\),[ \t]*$'
          )

          declarations = declaration.findall(code)
          binary_calls = re.findall(r"\.binaryTarget[ \t]*\(", code)
          binary_bindings = binary_binding.findall(code)
          url_identifiers = re.findall(r"\burl\b", code)
          urls = url_token.findall(code)
          binding_is_canonical = (
              len(declarations) == 1
              and len(binary_calls) == 1
              and len(binary_bindings) == 1
              and len(url_identifiers) == 3
              and len(urls) == 1
              and urls[0] == declarations[0]
              and allowed_url.fullmatch(declarations[0]) is not None
          )
          if not binding_is_canonical:
              print(
                  "Package.swift violates the canonical binaryTarget URL "
                  "binding to exactly one immutable versioned release asset URL",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Test scripts and reproduce distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          bash -n scripts/*.sh

          ./scripts/build-ios.sh --output .build/ci-repro-1
          ./scripts/verify-artifact.sh .build/ci-repro-1
          python3 scripts/archive.py --source .build/ci-repro-1/fcast_sender_sdk.xcframework --output .build/ci-repro-1.zip --source-epoch 1784900561

          ./scripts/build-ios.sh --output .build/ci-repro-2
          ./scripts/verify-artifact.sh .build/ci-repro-2
          python3 scripts/archive.py --source .build/ci-repro-2/fcast_sender_sdk.xcframework --output .build/ci-repro-2.zip --source-epoch 1784900561

          cmp .build/ci-repro-1.zip .build/ci-repro-2.zip
          ARCHIVE_SHA_1="$(shasum -a 256 .build/ci-repro-1.zip | awk '{print $1}')"
          ARCHIVE_SHA_2="$(shasum -a 256 .build/ci-repro-2.zip | awk '{print $1}')"
          SWIFTPM_CHECKSUM_1="$(swift package compute-checksum .build/ci-repro-1.zip)"
          SWIFTPM_CHECKSUM_2="$(swift package compute-checksum .build/ci-repro-2.zip)"
          [[ "$ARCHIVE_SHA_1" == "$ARCHIVE_SHA_2" ]]
          [[ "$ARCHIVE_SHA_1" == "$SWIFTPM_CHECKSUM_1" ]]
          [[ "$ARCHIVE_SHA_2" == "$SWIFTPM_CHECKSUM_2" ]]
          printf 'archive sha256: %s\nSwiftPM checksum: %s\n' \
            "$ARCHIVE_SHA_1" "$SWIFTPM_CHECKSUM_1"

          ./scripts/verify-local-package.sh .build/ci-repro-1
