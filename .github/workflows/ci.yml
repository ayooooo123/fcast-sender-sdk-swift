name: FCast iOS Distribution CI

on:
  pull_request:
  push:
    branches: [main, "mediastorm/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  validate:
    runs-on: macos-26
    steps:
      - name: Check out event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate locked build environment
        shell: bash
        run: |
          set -euo pipefail
          required_tools=(
            python3
            sudo
            xcode-select
            xcodebuild
            swift
            sw_vers
            /usr/bin/zip
            rustup
            shasum
            awk
            cmp
          )
          for required_tool in "${required_tools[@]}"; do
            if ! command -v "$required_tool" >/dev/null; then
              printf 'required CI tool is unavailable: %s\n' "$required_tool" >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "schemaVersion": 1,
              "runner": "macos-26",
              "xcodeVersion": "26.6",
              "xcodeBuildVersion": "17F113",
              "swiftVersion": "6.3.3",
              "swiftLanguageRevision": "swiftlang-6.3.3.1.3",
              "rustVersion": "1.96.1",
              "zipVersion": "3.0",
          }
          actual = json.loads(
              Path("build-environment.lock.json").read_text(encoding="utf-8")
          )
          if actual != expected:
              raise SystemExit("build environment lock does not match CI policy")
          PY

          LOCKED_XCODE="/Applications/Xcode_26.6.app"
          if [[ -d "$LOCKED_XCODE" ]]; then
            sudo xcode-select --switch "$LOCKED_XCODE/Contents/Developer"
          fi

          XCODE_OUTPUT="$(xcodebuild -version)"
          [[ "$XCODE_OUTPUT" == $'Xcode 26.6\nBuild version 17F113' ]]

          SWIFT_OUTPUT="$(swift --version)"
          [[ "$SWIFT_OUTPUT" == *"Apple Swift version 6.3.3 (swiftlang-6.3.3.1.3 "* ]]

          ACTUAL_MACOS_VERSION="$(sw_vers -productVersion)"
          ACTUAL_RUNNER="macos-${ACTUAL_MACOS_VERSION%%.*}"
          [[ "$ACTUAL_RUNNER" == "macos-26" ]]

          ZIP_OUTPUT="$(/usr/bin/zip -v)"
          [[ "$ZIP_OUTPUT" == *"This is Zip 3.0 "* ]]

      - name: Install locked Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 \
            aarch64-apple-ios \
            aarch64-apple-ios-sim
          RUST_OUTPUT="$(rustup run 1.96.1 rustc --version)"
          [[ "$RUST_OUTPUT" == "rustc 1.96.1 ("* ]]

      - name: Test scripts and reproduce distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          bash -n scripts/*.sh

          ./scripts/build-ios.sh --output .build/ci-repro-1
          ./scripts/verify-artifact.sh .build/ci-repro-1
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          def archive_members(path):
              data = path.read_bytes()
              if not data.startswith(b"!<arch>\n"):
                  raise SystemExit(f"not an ar archive: {path}")
              offset = 8
              while offset < len(data):
                  header = data[offset:offset + 60]
                  if len(header) != 60 or header[58:60] != b"`\n":
                      raise SystemExit(f"invalid ar header at {offset}: {path}")
                  raw_name = header[:16].decode("ascii").rstrip()
                  size = int(header[48:58].decode("ascii").strip())
                  payload = data[offset + 60:offset + 60 + size]
                  if raw_name.startswith("#1/"):
                      name_length = int(raw_name[3:])
                      name = payload[:name_length].decode("utf-8")
                      payload = payload[name_length:]
                  else:
                      name = raw_name.removesuffix("/")
                  yield name, payload
                  offset += 60 + size
                  if offset % 2:
                      offset += 1
              if offset != len(data):
                  raise SystemExit(f"invalid ar archive length: {path}")

          root = Path(".build/ci-repro-1/fcast_sender_sdk.xcframework")
          for identifier in ("ios-arm64", "ios-arm64-simulator"):
              archive = root / identifier / "libfcast_sender_sdk.a"
              print("FCast ar diagnostic", identifier, archive.stat().st_size)
              member_manifest = hashlib.sha256()
              object_manifest = hashlib.sha256()
              for member_index, (name, payload) in enumerate(
                  archive_members(archive)
              ):
                  payload_digest = hashlib.sha256(payload).hexdigest()
                  record = (
                      f"{name}\0{len(payload)}\0{payload_digest}\n".encode()
                  )
                  member_manifest.update(record)
                  if member_index == 0:
                      print(
                          "FCast ar index",
                          identifier,
                          payload_digest,
                          len(payload),
                          repr(name),
                      )
                  else:
                      object_manifest.update(record)
                  print(
                      "FCast ar member",
                      identifier,
                      payload_digest,
                      len(payload),
                      name,
                  )
              print(
                  "FCast ar aggregate",
                  identifier,
                  member_manifest.hexdigest(),
              )
              print(
                  "FCast ar object aggregate",
                  identifier,
                  object_manifest.hexdigest(),
              )
          raise SystemExit("intentional diagnostic stop after build 1")
          PY
          python3 scripts/archive.py --source .build/ci-repro-1/fcast_sender_sdk.xcframework --output .build/ci-repro-1.zip --source-epoch 1784900561

          ./scripts/build-ios.sh --output .build/ci-repro-2
          ./scripts/verify-artifact.sh .build/ci-repro-2
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          for build_name in ("ci-repro-1", "ci-repro-2"):
              root = (
                  Path(".build")
                  / build_name
                  / "fcast_sender_sdk.xcframework"
              )
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      digest = hashlib.sha256(path.read_bytes()).hexdigest()
                      print(
                          "FCast diagnostic",
                          build_name,
                          digest,
                          path.stat().st_size,
                          path.relative_to(root),
                      )
              print(
                  "FCast diagnostic Info.plist",
                  build_name,
                  (root / "Info.plist").read_text(encoding="utf-8"),
              )
          PY
          python3 scripts/archive.py --source .build/ci-repro-2/fcast_sender_sdk.xcframework --output .build/ci-repro-2.zip --source-epoch 1784900561

          cmp .build/ci-repro-1.zip .build/ci-repro-2.zip
          ARCHIVE_SHA_1="$(shasum -a 256 .build/ci-repro-1.zip | awk '{print $1}')"
          ARCHIVE_SHA_2="$(shasum -a 256 .build/ci-repro-2.zip | awk '{print $1}')"
          SWIFTPM_CHECKSUM_1="$(swift package compute-checksum .build/ci-repro-1.zip)"
          SWIFTPM_CHECKSUM_2="$(swift package compute-checksum .build/ci-repro-2.zip)"
          [[ "$ARCHIVE_SHA_1" == "$ARCHIVE_SHA_2" ]]
          [[ "$ARCHIVE_SHA_1" == "$SWIFTPM_CHECKSUM_1" ]]
          [[ "$ARCHIVE_SHA_2" == "$SWIFTPM_CHECKSUM_2" ]]

          export REBUILT_SWIFTPM_CHECKSUM="$SWIFTPM_CHECKSUM_1"
          DECLARED_PACKAGE_CHECKSUM="$(
            python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          from scripts.release_metadata import render_package

          version = "0.0.8-mediastorm.1"
          rebuilt_checksum = os.environ["REBUILT_SWIFTPM_CHECKSUM"]
          expected = render_package(version, rebuilt_checksum).encode("utf-8")
          actual = Path("Package.swift").read_bytes()
          if actual != expected:
              print(
                  "Package.swift must exactly match the canonical generated "
                  "manifest for the fixed release version and rebuilt archive "
                  "checksum",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(rebuilt_checksum)
          PY
          )"
          [[ "$ARCHIVE_SHA_1" == "$DECLARED_PACKAGE_CHECKSUM" ]]

          swift package --disable-sandbox dump-package \
            > .build/ci-package-dump.json
          export DECLARED_PACKAGE_CHECKSUM
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.release_metadata import release_url

          version = "0.0.8-mediastorm.1"
          payload = json.loads(
              Path(".build/ci-package-dump.json").read_text(encoding="utf-8")
          )
          targets = [
              target
              for target in payload.get("targets", [])
              if target.get("name") == "fcast_sender_sdkFFI"
          ]
          valid = (
              len(targets) == 1
              and targets[0].get("type") == "binary"
              and targets[0].get("url") == release_url(version)
              and targets[0].get("checksum")
              == os.environ["DECLARED_PACKAGE_CHECKSUM"]
          )
          if not valid:
              print(
                  "SwiftPM package semantics do not match the canonical "
                  "binary target URL and checksum",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

          printf 'archive sha256: %s\nSwiftPM checksum: %s\n' \
            "$ARCHIVE_SHA_1" "$SWIFTPM_CHECKSUM_1"

          ./scripts/verify-local-package.sh .build/ci-repro-1
